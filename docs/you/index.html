<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>YouTube 열기</title>
</head>
<body>
<script>
(function () {
 const VIDEO_ID = "E1d0DsUk5os";
 const SI = "4h9PrC87Z3-zaKKC";
 // 1️⃣ YouTube PREF 쿠키 세팅 URL
 const COOKIE_URL =
   "https://www.youtube.com/?hl=ko&gl=KR";
 // 2️⃣ 최종 쇼츠 URL
 const TARGET_URL =
   `https://www.youtube.com/shorts/${VIDEO_ID}?si=${SI}`;
 // 1단계: 쿠키 심기
 window.location.href = COOKIE_URL;
 // 2단계: 쿠키가 세팅된 후 쇼츠로 이동
 setTimeout(() => {
   window.location.href = TARGET_URL;
 }, 800);
})();
</script>
</body>
</html>
