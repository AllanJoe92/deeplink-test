<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>YouTube 한국어로 보기</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
   body {
     font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                  "Noto Sans KR", Arial, sans-serif;
     padding: 24px;
     text-align: center;
   }
   button {
     margin-top: 20px;
     padding: 14px 20px;
     font-size: 16px;
     border-radius: 10px;
     border: none;
     background: #ff0000;
     color: #fff;
     font-weight: 700;
   }
   .hint {
     margin-top: 16px;
     font-size: 14px;
     color: #666;
   }
</style>
</head>
<body>
<h3>유튜브를 한국어로 여는 중</h3>
<p>아래 버튼을 눌러 영상을 시청해 주세요.</p>
<button id="open">한국어로 영상 보기</button>
<div class="hint">
 ※ 영상은 웹으로 열리며, 한국어 UI가 우선 적용됩니다.
</div>
<script>
(function () {
 const VIDEO_ID = "E1d0DsUk5os";
 // 🎯 한국어 성공률 최우선 URL
 const TARGET_URL =
   `https://m.youtube.com/watch?v=${VIDEO_ID}&hl=ko&gl=KR`;
 document.getElementById("open").onclick = () => {
   window.location.href = TARGET_URL;
 };
})();
</script>
</body>
</html>
