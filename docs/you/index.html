<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>YouTube 열기</title>
<style>
   body {
     font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                  "Noto Sans KR", Arial, sans-serif;
     padding: 24px;
     line-height: 1.5;
     text-align: center;
   }
   .btn {
     display: block;
     margin: 14px auto;
     padding: 14px 18px;
     max-width: 280px;
     border-radius: 10px;
     border: 1px solid #ddd;
     text-decoration: none;
     color: #000;
     font-size: 16px;
     background: #fafafa;
   }
   .primary {
     background: #ff0000;
     color: #fff;
     border: none;
     font-weight: 600;
   }
   .hint {
     margin-top: 18px;
     font-size: 14px;
     color: #666;
   }
</style>
</head>
<body>
<h3>유튜브에서 보기</h3>
<p>아래 버튼을 눌러 시청해 주세요.</p>
<!-- 🔴 핵심 버튼 -->
<a
   class="btn primary"
   href="https://youtube.com/shorts/E1d0DsUk5os?si=4h9PrC87Z3-zaKKC"
   target="_blank"
   rel="noopener"
>
   브라우저에서 열기
</a>
<div class="hint">
   • 안드로이드에서는 카카오톡 내부에서 앱 실행이 제한됩니다.<br>
   • 외부 브라우저로 열면 유튜브 앱이 자동 실행됩니다.<br>
   • iOS에서는 자동으로 앱이 열릴 수 있습니다.
</div>
</body>
</html>
