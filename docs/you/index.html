<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>YouTube 한국어로 보기</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
   body {
     margin: 0;
     padding: 0;
     font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                  "Noto Sans KR", Arial, sans-serif;
     background: #000;
     color: #fff;
   }
   .wrapper {
     max-width: 480px;
     margin: 0 auto;
     padding-top: 16px;
   }
   .title {
     text-align: center;
     padding: 12px;
     font-size: 15px;
   }
   iframe {
     width: 100%;
     height: 80vh;
     border: none;
   }
</style>
</head>
<body>
<div class="wrapper">
<div class="title">영상은 한국어 UI로 재생됩니다</div>
<iframe
   src="https://www.youtube.com/embed/E1d0DsUk5os
     ?hl=ko
&cc_lang_pref=ko
&cc_load_policy=1
&modestbranding=1
&playsinline=1"
   allow="autoplay; encrypted-media; picture-in-picture"
   allowfullscreen>
</iframe>
</div>
</body>
</html>
